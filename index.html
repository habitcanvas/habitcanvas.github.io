<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit Canvas — Habit tracker for iPhone</title>
<meta name="description" content="Habit Canvas: streak grids and habit chains on your own canvas. A private habit tracker for iPhone.">
<style>
  :root { --bg: #f7f8fa; --surface: #ffffff; --text: #0e1116; --muted: #4b5563; --line: #e5e7eb; --empty: #dde2ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1012; --surface: #17191c; --text: #f2f2ef; --muted: #a9acb2; --line: #2a2d33; --empty: #2a2d33; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; }
  main { max-width: 520px; padding: 48px 16px; text-align: center; }
  .logo { display: inline-grid; grid-template-columns: repeat(3, 28px); gap: 7px; padding: 22px; border-radius: 28px;
    background: var(--surface); border: 1px solid var(--line); margin-bottom: 28px; }
  .logo span { width: 28px; height: 28px; border-radius: 8px; background: var(--empty); }
  .g { background: #22a55b !important; } .b { background: #3b7cf6 !important; } .o { background: #f07b1e !important; }
  h1 { font-size: 34px; line-height: 1.15; margin: 0 0 10px; letter-spacing: -0.02em; }
  p { color: var(--muted); margin: 0 0 28px; }
  nav { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  nav a { color: var(--text); text-decoration: none; border: 1px solid var(--line); background: var(--surface);
    padding: 10px 18px; border-radius: 999px; font-size: 15px; }
  nav a:hover { border-color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">
    <span class="g"></span><span class="g"></span><span></span>
    <span></span><span class="b"></span><span class="b"></span>
    <span></span><span></span><span class="o"></span>
  </div>
  <h1>Habit Canvas</h1>
  <p>Streak grids and habit chains on your own canvas. A private habit tracker for iPhone.</p>
  <nav>
    <a href="support/">Support</a>
    <a href="privacy/">Privacy Policy</a>
  </nav>
</main>
</body>
</html>
